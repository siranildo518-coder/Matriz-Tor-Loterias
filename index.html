<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matriz Tor Loterias</title><style>body{background:#101820;color:white;font:16px system-ui;margin:12px}header{position:sticky;top:0;background:#101820;padding:12px;text-align:center}section{border:1px solid #657786;border-radius:10px;padding:12px;margin:10px 0}button{padding:8px;color:white;background:#34495e;border:1px solid #888;border-radius:6px}.balls{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.ball{border-radius:50%;padding:7px;background:#555;min-width:20px;text-align:center}small{color:#bbb}</style><header><h2>Matriz Tor Loterias</h2><small>Versão 3</small><p></p><button onclick="load()">Atualizar</button><p id="status">Aguardando coleta</p></header><main id="out"></main><script>const names={LF:'Lotofácil',MS:'Mega-Sena',QN:'Quina',LM:'Lotomania',DI:'Dia de Sorte'};const colors={LF:'#7133a5',MS:'#16834b',QN:'#1766b0',LM:'#bd5c13',DI:'#927000',DS1:'#a52c3e',DS2:'#a52c3e'};const out=document.getElementById('out'), statusEl=document.getElementById('status');async function load(){statusEl.textContent='Consultando resultados…';try{let d;for(const url of ['resultados.json','https://raw.githubusercontent.com/siranildo518-coder/Matriz-Tor-Loterias/main/resultados.json']){try{let r=await fetch(url+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)continue;let j=await r.json();if(Object.keys(j).length){d=j;break}}catch(e){}}if(!d)throw Error('Dados indisponíveis');out.replaceChildren();for(let k of Object.keys(names)){let s=document.createElement('section');let h=document.createElement('strong');h.textContent=names[k];s.append(h);let cs=Object.keys(d[k]||{}).sort((a,b)=>b-a);if(!cs.length){let p=document.createElement('p');p.textContent='Aguardando coleta';s.append(p);}else{let sel=document.createElement('select');for(let c of cs)sel.add(new Option('Concurso '+c,c));let p=document.createElement('p');p.append(sel);s.append(p);let balls=document.createElement('div');balls.className='balls';s.append(balls);let render=()=>{balls.replaceChildren();for(let n of d[k][sel.value].dezenas){let b=document.createElement('span');b.className='ball';b.style.background=colors[k];b.textContent=n;balls.append(b)}};sel.onchange=render;render()}out.append(s)}statusEl.textContent=Object.keys(d).length?'Resultados disponíveis':'Aguardando coleta'}catch(e){statusEl.textContent='Falha ao consultar resultados: '+e.message+''}}load();setInterval(load,60000)</script></html>
