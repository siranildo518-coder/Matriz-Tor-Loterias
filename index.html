<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matriz Tor Loterias</title><style>body{background:#101820;color:white;font:16px system-ui;margin:12px}header{position:sticky;top:0;background:#101820;padding:12px;text-align:center}section{border:1px solid #657786;border-radius:10px;padding:12px;margin:10px 0}button{padding:8px;color:white;background:#34495e;border:1px solid #888;border-radius:6px}.balls{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.ball{border-radius:50%;padding:7px;background:#555;min-width:20px;text-align:center}small{color:#bbb}</style><header><h2>Matriz Tor Loterias</h2><button onclick="load()">Atualizar</button><p id="status">Aguardando coleta</p></header><main id="out"></main><script>const names={LF:'Lotofácil',MS:'Mega-Sena',QN:'Quina',LM:'Lotomania',DI:'Dia de Sorte',DS1:'Dupla Sena — 1º sorteio',DS2:'Dupla Sena — 2º sorteio'};const colors={LF:'#7133a5',MS:'#16834b',QN:'#1766b0',LM:'#bd5c13',DI:'#927000',DS1:'#a52c3e',DS2:'#a52c3e'};async function load(){try{let r=await fetch('resultados.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();let d=await r.json();out.replaceChildren();for(let k of Object.keys(names)){let s=document.createElement('section');let h=document.createElement('strong');h.textContent=names[k];s.append(h);let cs=Object.keys(d[k]||{}).sort((a,b)=>b-a);if(!cs.length)s.append(document.createElement('p')).textContent='Aguardando coleta';else{let sel=document.createElement('select');for(let c of cs)sel.add(new Option('Concurso '+c,c));s.append(document.createElement('p')).append(sel);let balls=document.createElement('div');balls.className='balls';s.append(balls);let render=()=>{balls.replaceChildren();for(let n of d[k][sel.value].dezenas){let b=document.createElement('span');b.className='ball';b.style.background=colors[k];b.textContent=n;balls.append(b)}};sel.onchange=render;render()}out.append(s)}status.textContent=Object.keys(d).length?'Resultados disponíveis':'Aguardando coleta'}catch(e){status.textContent='Falha ao consultar resultados'}}load();setInterval(load,60000)</script></html>
