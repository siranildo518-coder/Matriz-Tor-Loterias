name: Receber resultados
on:
  repository_dispatch:
    types: [coleta]
permissions:
  contents: write
concurrency:
  group: coleta
  cancel-in-progress: false
jobs:
  salvar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar e salvar
        run: |
          python - <<'PY'
          import json, os, pathlib
          p=json.load(open(os.environ['GITHUB_EVENT_PATH']))['client_payload']
          f=pathlib.Path('resultados.json')
          db=json.loads(f.read_text()) if f.exists() else {}
          regras={'LF':(15,1,25),'MS':(6,1,60),'QN':(5,1,80),'LM':(20,0,99),'DI':(7,1,31),'DS1':(6,1,50),'DS2':(6,1,50)}
          for k,v in p.items():
              if k not in regras: continue
              n,a,b=regras[k]
              c=int(v['concurso'])
              d=[int(x) for x in str(v['dezenas']).split()]
              if c<=0 or len(d)!=n or len(set(d))!=n or not all(a<=x<=b for x in d):
                  print(f'Ignorado resultado invalido: {k}')
                  continue
              db.setdefault(k,{})[str(c)]={'dezenas':[f'{x:02d}' for x in sorted(d)]}
          f.write_text(json.dumps(db,ensure_ascii=False,indent=2))
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add resultados.json
          git diff --cached --quiet || (git commit -m "Atualizar resultados" && git push)
